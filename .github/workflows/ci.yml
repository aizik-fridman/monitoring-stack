name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and configuration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform without backend
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint promtool \
            --volume "$PWD/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.4.2 \
            check config /etc/prometheus/prometheus.yml

      - name: Lint YAML files
        run: |
          python -m pip install --disable-pip-version-check yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" \
            .github/workflows config kubernetes prometheus docker-compose.yml

      - name: Validate dashboard JSON
        run: python -m json.tool config/grafana/dashboards/stack-overview.json > /dev/null

      - name: Compile webhook receiver
        run: python -m compileall -q ops/webhook-receiver

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan IaC and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  compose-smoke-test:
    name: Docker Compose integration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0

      - name: Build and start stack
        run: docker compose up --build --detach

      - name: Verify service endpoints
        shell: bash
        run: |
          set -euo pipefail

          wait_for_url() {
            local url="$1"
            local label="$2"
            echo "Waiting for ${label} at ${url}"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" >/dev/null 2>&1; then
                echo "${label} is ready"
                return 0
              fi
              sleep 5
            done
            echo "Timed out waiting for ${label}" >&2
            return 1
          }

          wait_for_url http://localhost:9090/-/ready Prometheus
          wait_for_url http://localhost:9091/-/healthy Thanos
          wait_for_url http://localhost:8428/health VictoriaMetrics
          wait_for_url http://localhost:3200/ready Tempo
          wait_for_url http://localhost:3100/ready Loki
          wait_for_url http://localhost:3000/api/health Grafana
          wait_for_url http://localhost:9000/minio/health/live MinIO

          targets="$(curl --fail --silent http://localhost:9090/api/v1/targets)"
          echo "$targets" | jq -e \
            '[.data.activeTargets[] | select(.labels.job == "node-exporter" or .labels.job == "cadvisor") | select(.health == "up")] | length == 2'

          datasources="$(curl --fail --silent --user admin:admin http://localhost:3000/api/datasources)"
          echo "$datasources" | jq -e \
            '[.[].uid] | (index("thanos") != null and index("victoriametrics") != null and index("tempo") != null and index("loki") != null)'

      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
