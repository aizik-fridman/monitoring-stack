name: prometheus-grafana-kit

services:
  prometheus:
    image: prom/prometheus:v3.4.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=48h
      - --storage.tsdb.min-block-duration=2h
      - --storage.tsdb.max-block-duration=2h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [observability]
    depends_on:
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
      victoria-metrics:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  thanos-sidecar:
    image: quay.io/thanos/thanos:v0.39.2
    restart: unless-stopped
    command:
      - sidecar
      - --tsdb.path=/prometheus
      - --prometheus.url=http://prometheus:9090
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
    volumes:
      - prometheus_data:/prometheus:ro
      - ./config/thanos/objstore.yml:/etc/thanos/objstore.yml:ro
    networks: [observability]
    depends_on:
      prometheus:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  thanos-store:
    image: quay.io/thanos/thanos:v0.39.2
    restart: unless-stopped
    command:
      - store
      - --data-dir=/var/thanos/store
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
    volumes:
      - thanos_store_data:/var/thanos/store
      - ./config/thanos/objstore.yml:/etc/thanos/objstore.yml:ro
    networks: [observability]
    depends_on:
      minio-init:
        condition: service_completed_successfully

  thanos-compact:
    image: quay.io/thanos/thanos:v0.39.2
    restart: unless-stopped
    command:
      - compact
      - --data-dir=/var/thanos/compact
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --http-address=0.0.0.0:10902
      - --wait
    volumes:
      - thanos_compact_data:/var/thanos/compact
      - ./config/thanos/objstore.yml:/etc/thanos/objstore.yml:ro
    networks: [observability]
    depends_on:
      minio-init:
        condition: service_completed_successfully

  thanos-query:
    image: quay.io/thanos/thanos:v0.39.2
    restart: unless-stopped
    command:
      - query
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
      - --query.replica-label=replica
      - --store=thanos-sidecar:10901
      - --store=thanos-store:10901
    ports:
      - "9091:10902"
    networks: [observability]
    depends_on:
      thanos-sidecar:
        condition: service_started
      thanos-store:
        condition: service_started

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.123.0
    restart: unless-stopped
    command:
      - --storageDataPath=/victoria-metrics-data
      - --retentionPeriod=30d
    volumes:
      - victoria_metrics_data:/victoria-metrics-data
    ports:
      - "8428:8428"
    networks: [observability]

  minio-volume-init:
    image: busybox:1.37.0
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "chown -R 1001:1001 /data"]
    volumes:
      - minio_data:/data

  minio:
    image: bitnamilegacy/minio:2025.4.22-debian-12-r0
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [observability]
    depends_on:
      minio-volume-init:
        condition: service_completed_successfully

  minio-init:
    image: bitnamilegacy/minio-client:2025.4.16-debian-12-r0
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for attempt in $$(seq 1 45); do
          if mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1 &&
             mc ready local >/dev/null 2>&1; then
            mc mb --ignore-existing local/thanos &&
            mc mb --ignore-existing local/tempo &&
            exit 0
          fi
          sleep 2
        done
        echo "MinIO did not become ready before bucket initialization timed out." >&2
        exit 1
    networks: [observability]

  tempo:
    image: grafana/tempo:2.8.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    networks: [observability]
    depends_on:
      minio-init:
        condition: service_completed_successfully

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [observability]

  alloy:
    image: grafana/alloy:v1.10.2
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    networks: [observability]
    depends_on:
      loki:
        condition: service_started

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose: ["9100"]
    networks: [observability]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose: ["8080"]
    networks: [observability]

  alert-webhook:
    build:
      context: ./ops/webhook-receiver
    restart: unless-stopped
    expose: ["8080"]
    networks: [observability]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks: [observability]
    depends_on:
      thanos-query:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
      alert-webhook:
        condition: service_healthy

volumes:
  prometheus_data:
  victoria_metrics_data:
  thanos_store_data:
  thanos_compact_data:
  tempo_data:
  loki_data:
  alloy_data:
  minio_data:
  grafana_data:

networks:
  observability:
    name: observability
    driver: bridge
