apiVersion: 1

groups:
  - orgId: 1
    name: local-stack-health
    folder: SRE
    interval: 1m
    rules:
      - uid: prometheus-target-down
        title: PrometheusTargetDown
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: thanos
            model:
              expr: up == 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: classic_conditions
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "A Prometheus scrape target is unavailable."
          description: "At least one target has reported up == 0 for two minutes."
        labels:
          severity: warning
