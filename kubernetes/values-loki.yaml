deploymentMode: SimpleScalable

loki:
  auth_enabled: true
  commonConfig:
    replication_factor: 3
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: REPLACE_WITH_LOKI_BUCKET
      ruler: REPLACE_WITH_LOKI_BUCKET
      admin: REPLACE_WITH_LOKI_BUCKET
    s3:
      region: us-east-1
      insecure: false

gateway:
  replicas: 2

backend:
  replicas: 3

read:
  replicas: 3

write:
  replicas: 3
